name: CI

# Deploys now pull straight from main, so main breaking means production
# breaking on the next deploy. This runs on every push and PR to catch that
# before it reaches the server.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails the build if a credential lands in the tree. Uses the pinned binary
  # rather than gitleaks-action, which needs a paid licence for org repos.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # Only the commits this PR adds; older history is covered by rotating
      # the credentials it contains, not by blocking every build on it.
      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Docker images (node:22.21.1-bookworm-slim).
          node-version: '22'
          cache: 'npm'

      # npm ci needs the lockfile to agree with every workspace package.json —
      # which also makes a forgotten lockfile update a build failure rather than
      # a surprise on the server.
      - name: Install
        run: npm ci

      - name: Build ingestion-service
        run: npm run build --prefix services/ingestion-service

      - name: Build auth-service
        run: npm run build --prefix services/auth-service

      - name: Build api-gateway
        run: npm run build --prefix services/api-gateway

      - name: Test ingestion-service
        run: npm test --prefix services/ingestion-service

      - name: Test packages/db (migrations, schema check, compression vs backfill)
        run: npm test -w packages/db

      # Last because it is by far the slowest step: fail fast on the cheap ones.
      - name: Build web
        run: npm run build --prefix apps/web
        env:
          # Build-time only (baked into the bundle); next.config.js refuses to
          # build without it. The images get the real value as a build arg.
          NEXT_PUBLIC_API_URL: http://localhost:8081

  # The migrations against a real, empty TimescaleDB: apply, re-run (must be a
  # no-op), check nothing is pending.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      timescaledb:
        image: timescale/timescaledb:2.25.2-pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: migrate up (empty database)
        run: node packages/db/bin/migrate.js up
      - name: migrate up again (no-op)
        run: node packages/db/bin/migrate.js up
      - name: nothing pending
        run: node packages/db/bin/migrate.js status

  # Every image must build for the Oracle A1 (arm64) VM and for amd64.
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 + linux/amd64
        run: bash deploy/scripts/build-multiarch.sh
        env:
          APP_DOMAIN: ci.invalid
