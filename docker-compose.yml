# Grid-IQ — full stack, one Docker Compose project.
#
#   cp .env.example .env        # then fill in every change_me
#   docker compose up -d --build
#
# Only caddy (80/443) and mosquitto (8883) publish host ports. Everything else
# is reachable only on the compose network. Local dev extras (127.0.0.1-only
# ports for the DB and plain MQTT) live in docker-compose.override.yml.example.
#
# Persistent data lives under ${DATA_DIR} (default ./.data):
#   pg/  caddy/  mosquitto/data/  mqtt-certs/  uploads/

x-restart: &restart
  restart: unless-stopped

# One image, four services: api / ingest / jobs (ROLES) and the migrate one-shot.
x-ingestion-image: &ingestion-image
  image: gridiq/ingestion-service:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: services/ingestion-service/Dockerfile

x-ingestion-env: &ingestion-env
  DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  UPLOAD_DIR: /data/uploads
  # Public API exports (Phase 9): written by jobs, served by api, kept 7 days.
  EXPORT_DIR: /data/exports
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  # Retention windows: every ingestion role checks them against the DB
  # policies at startup; migrate applies them.
  MAX_BACKFILL_DAYS: ${MAX_BACKFILL_DAYS:-14}
  COMPRESS_AFTER_DAYS: ${COMPRESS_AFTER_DAYS:-15}
  # Broker portfolio routes and the renewal sweep (kept, off by default).
  FEATURE_BROKER: ${FEATURE_BROKER:-false}

services:
  caddy:
    <<: *restart
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      MQTT_DOMAIN: ${MQTT_DOMAIN:?set MQTT_DOMAIN in .env}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates, local CA and ACME account. sync-mqtt-certs.sh reads
      # ${DATA_DIR}/caddy/certificates/<issuer>/<MQTT_DOMAIN>/.
      - ${DATA_DIR:-./.data}/caddy:/data/caddy
      - ${DATA_DIR:-./.data}/caddy-config:/config/caddy
    depends_on:
      - web
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4

  web:
    <<: *restart
    image: gridiq/web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle; the browser calls the API via Caddy.
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
        # The broker host shown to installers on the Add Meter screen.
        NEXT_PUBLIC_MQTT_HOST: ${MQTT_DOMAIN}
        NEXT_PUBLIC_FEATURE_BROKER: ${FEATURE_BROKER:-false}
        NEXT_PUBLIC_FEATURE_TOOLS: ${FEATURE_TOOLS:-false}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}

  gateway:
    <<: *restart
    image: gridiq/api-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_URL: https://${APP_DOMAIN}
      AUTH_SERVICE_URL: http://auth:3001
      INGESTION_SERVICE_URL: http://api:3002
      API_KEY_RATE_PER_MIN: ${API_KEY_RATE_PER_MIN:-120}
      # One proxy hop (Caddy) in front of the gateway.
      TRUST_PROXY: "1"
    depends_on:
      - auth
      - api

  auth:
    <<: *restart
    image: gridiq/auth-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Served over HTTPS by Caddy, so the auth cookie is Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # REST endpoints.
  api:
    <<: [*restart, *ingestion-image]
    environment:
      <<: *ingestion-env
      ROLES: api
      # /api/health/deep for the external uptime monitor (disabled when empty)
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      HEALTH_MAX_FLUSH_AGE_S: ${HEALTH_MAX_FLUSH_AGE_S:-300}
      HEALTH_MAX_BACKUP_AGE_H: ${HEALTH_MAX_BACKUP_AGE_H:-26}
      HEALTH_REQUIRE_BACKUP: ${HEALTH_REQUIRE_BACKUP:-true}
      METER_SILENT_MINUTES: ${METER_SILENT_MINUTES:-5}
    volumes:
      - ${DATA_DIR:-./.data}/uploads:/data/uploads
      - ${DATA_DIR:-./.data}/exports:/data/exports
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # MQTT → DB only. Independent of api: stopping api does not stop ingestion.
  ingest:
    <<: [*restart, *ingestion-image]
    environment:
      <<: *ingestion-env
      ROLES: ingest
      # Resolves to the mosquitto container (network alias below), so the TLS
      # hostname matches the certificate without leaving the host.
      MQTT_BROKER_URL: mqtts://${MQTT_DOMAIN}:8883
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_CA_CERT: ${MQTT_CA_CERT:-}
      MQTT_TLS_REJECT_UNAUTHORIZED: ${MQTT_TLS_REJECT_UNAUTHORIZED:-true}
      # Persistent session id: must stay the same across restarts.
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-gridiq-ingest}
      INGEST_FLUSH_MS: ${INGEST_FLUSH_MS:-1000}
      INGEST_FLUSH_ROWS: ${INGEST_FLUSH_ROWS:-500}
      INGEST_MAX_QUEUE: ${INGEST_MAX_QUEUE:-50000}
      EVENT_MIN_SECONDS: ${EVENT_MIN_SECONDS:-3}
      INGEST_LOG_MESSAGES: ${INGEST_LOG_MESSAGES:-false}
    # On SIGTERM ingest flushes and acks its queue before disconnecting.
    stop_grace_period: 30s
    volumes:
      # Only read when MQTT_CA_CERT points into it (local dev's Caddy CA).
      - ${DATA_DIR:-./.data}/mqtt-certs:/mqtt-certs:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started

  # Every cron.schedule job.
  jobs:
    <<: [*restart, *ingestion-image]
    environment:
      <<: *ingestion-env
      ROLES: jobs
      METER_SILENT_MINUTES: ${METER_SILENT_MINUTES:-5}
      EVENT_ALERT_MIN_SECONDS: ${EVENT_ALERT_MIN_SECONDS:-10}
    volumes:
      - ${DATA_DIR:-./.data}/exports:/data/exports
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: applies pending migrations (packages/db/migrations) and exits 0.
  # Every app service waits for it and refuses to start on an outdated schema.
  # deploy.sh runs it before `up -d`. Not restarted.
  migrate:
    <<: *ingestion-image
    restart: "no"
    command: ["node", "/app/packages/db/bin/migrate.js", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      # Applied to the compression and aggregate-refresh policies after migrating.
      MAX_BACKFILL_DAYS: ${MAX_BACKFILL_DAYS:-14}
      COMPRESS_AFTER_DAYS: ${COMPRESS_AFTER_DAYS:-15}
    healthcheck:
      disable: true
    depends_on:
      timescaledb:
        condition: service_healthy

  # Tools (profile "tools": never started by `up`). The S3 client that
  # deploy/scripts/backup.sh and restore-drill.sh run with `compose run`.
  awscli:
    image: amazon/aws-cli:2.38.0
    profiles: [tools]
    environment:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - ${DATA_DIR:-./.data}/backups:/backups

  # age, for encrypting backups before upload (deploy/scripts/backup.sh) and
  # decrypting them for the restore drill. Profile "tools": never started by `up`.
  age:
    image: gridiq/age:1.2.1
    build: deploy/tools/age
    profiles: [tools]
    volumes:
      - ${DATA_DIR:-./.data}/backups:/backups

  mosquitto:
    <<: *restart
    image: eclipse-mosquitto:2.0.22
    ports:
      - "8883:8883"
    # Waits for the TLS certificate (deploy/scripts/sync-mqtt-certs.sh) instead
    # of crash-looping on a fresh install before Caddy has issued it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until [ -s /mosquitto/certs/fullchain.pem ] && [ -s /mosquitto/certs/privkey.pem ]; do
          echo "mosquitto: waiting for /mosquitto/certs (run deploy/scripts/sync-mqtt-certs.sh)"; sleep 10
        done
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ${DATA_DIR:-./.data}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR:-./.data}/mqtt-certs:/mosquitto/certs:ro
    networks:
      default:
        aliases:
          - ${MQTT_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  timescaledb:
    <<: *restart
    # Upgrading the image is safe: `migrate` runs ALTER EXTENSION timescaledb
    # UPDATE when the image ships a newer version than the database has.
    # Restoring a dump: see deploy/scripts/restore-dump.sh.
    image: timescale/timescaledb:2.25.2-pg16
    environment:
      # Only used when the data directory is first initialised.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-./.data}/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
