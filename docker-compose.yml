version: '3.8'

services:
  # TimescaleDB (PostgreSQL for Time-Series & Relational Data)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: powerguard-db
    restart: always
    environment:
      # From the root .env (see .env.example). Only used when the data volume
      # is first initialised; changing it later does not change the DB password.
      POSTGRES_USER: ${POSTGRES_USER:-powerguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-powerguard_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis (Caching & Message Broker for specialized queues if needed)
  redis:
    image: redis:alpine
    container_name: powerguard-redis
    restart: always
    ports:
      - "6379:6379"

  # MQTT Message Broker (for live Acuvim Telemetry)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: powerguard-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  db_data:
