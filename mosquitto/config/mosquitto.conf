# Grid-IQ Mosquitto broker. TLS only on 8883; the certificate is Caddy's
# certificate for MQTT_DOMAIN, copied by deploy/scripts/sync-mqtt-certs.sh.
# Local dev adds a plain listener on 127.0.0.1:1883 through
# mosquitto/config/conf.d/ (see docker-compose.override.yml.example).
per_listener_settings false

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
max_queued_messages 200000
max_queued_bytes 0
queue_qos0_messages true
# ingest holds each PUBACK until the batch that wrote the message has
# committed (up to INGEST_FLUSH_MS). With the default of 20 unacked QoS 1
# messages per client, the broker would deliver only ~20 messages per flush.
max_inflight_messages 1000

log_dest stdout

# Extra listeners for local dev only (the directory is empty in production).
include_dir /mosquitto/config/conf.d
